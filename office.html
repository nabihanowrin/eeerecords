<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office desk — EEE Records</title>
<style>
:root{
  --side:#1E2A32; --side-text:#AEBBC4; --cream:#F6F2EE; --card:#FFFFFF;
  --ink:#1C1A19; --grey:#6E6764; --line:#E4DCD6;
  --accent:#7E2233; --accent-wash:#F4E8EA;
  --ok:#3F6A52; --ok-wash:#E3EFE7; --bad:#A4343F; --bad-wash:#F8E3E5;
  --edit:#B07A12; --edit-wash:#F8EEDA;
  --butter:#F2EBC6;
  --sans:Arial,Helvetica,sans-serif; --serif:Arial,Helvetica,sans-serif; --mono:Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--sans)}
button,input,textarea{font-family:inherit}

.in{opacity:0;transform:translateY(18px);animation:up .5s cubic-bezier(.16,.84,.34,1) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1;transform:none}}

.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-text);padding:18px 0 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.me{padding:0 24px 16px;border-bottom:1px solid #2E3C46}
.me .dot{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px}
.me .nm{color:#fff;font-weight:600;font-size:14.5px;margin-top:9px}
.me .sub{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;margin-top:3px;overflow-wrap:anywhere}
.me .role{font-size:12.5px;margin-top:7px;color:#D6C8A8}

.nav{display:flex;flex-direction:column;gap:2px;padding:22px 0 22px 16px;min-height:0;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}
.nav::-webkit-scrollbar{width:0;height:0;display:none}
.nav button{position:relative;display:flex;align-items:center;gap:12px;padding:9px 18px;border:none;background:none;color:var(--side-text);font-size:14px;text-align:left;cursor:pointer;border-radius:22px 0 0 22px;transition:color .2s ease}
.nav button:hover{color:#fff}
.nav button svg{width:18px;height:18px;flex-shrink:0}
.nav button small{margin-left:auto;font-size:11.5px;opacity:.75}
.nav button.on{background:var(--cream);color:var(--ink);font-weight:600}
.nav button.on::before,.nav button.on::after{content:"";position:absolute;right:0;width:22px;height:22px;background:transparent;pointer-events:none}
.nav button.on::before{top:-22px;border-bottom-right-radius:22px;box-shadow:8px 8px 0 8px var(--cream)}
.nav button.on::after{bottom:-22px;border-top-right-radius:22px;box-shadow:8px -8px 0 8px var(--cream)}
.side .out{margin:auto 24px 0;background:none;border:1px solid #3A4A55;color:var(--side-text);border-radius:30px;padding:9px;font-size:13px;cursor:pointer}

.main{padding:34px 40px 70px;max-width:1100px;width:100%}
h1.page{font-family:var(--serif);font-weight:600;font-size:36px;font-weight:400;line-height:1.1}
.lede{color:var(--grey);margin-top:6px;font-size:14.5px;line-height:1.55}

.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-top:20px}
.box h2{font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.box h2 .r{margin-left:auto;font-weight:400;font-size:13px;color:var(--grey)}

.ask{border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:14px;background:var(--card)}
.ask.waiting{border-color:#EAD7AF;background:#FFFDF7}
.ask .top{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.ask .code{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--accent)}
.ask h3{font-size:16px;font-weight:600}
.ask .m{font-size:13px;color:var(--grey);margin-top:6px;line-height:1.5}
.ask .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.ask input{flex:1;min-width:200px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;font-size:13.5px}
.ask .msg{font-size:12.5px;color:var(--bad);width:100%}

.pill{display:inline-block;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap}
.pill.ok{background:var(--ok-wash);color:var(--ok)}
.pill.wait{background:var(--edit-wash);color:var(--edit)}
.pill.no{background:var(--bad-wash);color:var(--bad)}
.pill.dim{background:#F0EAE5;color:var(--grey)}

.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:30px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer}
.btn.solid{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:7px 14px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.nav .code{font-size:13.5px;padding-top:6px;padding-bottom:6px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.nav .group{font-size:11px;letter-spacing:.1em;color:#6F8290;padding:10px 18px 3px}

/* tiles on the home page */
.tiles{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
.tile{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:14px 18px;min-width:150px;text-align:left}
.tile .k{font-size:12px;color:var(--grey)}
.tile .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:24px;margin:3px 0}
.tile.warn{background:var(--edit-wash);border-color:#EAD7AF}
.tile.pick{cursor:pointer}
.tile.pick:hover{border-color:var(--accent)}

/* the register */
.form{display:grid;gap:12px;margin-top:14px;max-width:560px}
.form.two{grid-template-columns:1fr 1fr;max-width:100%}
.form label{font-size:12px;color:var(--grey);display:block;margin-bottom:4px}
.form input,.form select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--cream);font-family:inherit}
.form .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.form .msg{font-size:13px}
.msg.bad{color:var(--bad)}
.sheet{border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:64vh;margin-top:14px}
.sheet table{width:100%;border-collapse:collapse}
.sheet th{position:sticky;top:0;background:var(--card);text-align:left;font-size:11.5px;letter-spacing:.05em;color:var(--grey);padding:10px 12px;border-bottom:1px solid var(--line)}
.sheet td{padding:10px 12px;font-size:13.5px;border-bottom:1px solid #F3EDE8;vertical-align:middle}
.sheet tr.editing td{background:#FFFDF7}
.sheet tr.editing input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;margin-bottom:4px;font-family:inherit}
.sheet td.right{text-align:right;white-space:nowrap}
.sheet td.right .btn{margin-left:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tiny{font-size:11px;color:var(--edit)}

.result{margin-top:16px;border-radius:14px;padding:18px 20px;font-size:14.5px;line-height:1.5}
.result.good{background:var(--ok-wash);color:var(--ok)}
.result.bad{background:var(--bad-wash);color:var(--bad)}
.result b{display:block;font-size:16px;margin-bottom:4px}
.foot2{margin-top:26px;font-size:12.5px;color:var(--grey)}
.hide{display:none}
.cphoto{max-width:320px;max-height:240px;border-radius:10px;margin-top:10px;display:block}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto}
  .nav{flex-direction:row;flex-wrap:wrap;padding:22px 14px 0}
  .nav button{border-radius:22px}
  .nav button.on::before,.nav button.on::after{display:none}
  .main{padding:24px 16px 60px}
}
</style>
</head>
<body>

<div class="shell hide" id="app">
  <aside class="side">
    <div class="me">
      <div class="dot">OF</div>
      <div class="nm" id="name">Academic office</div>
      <div class="sub" id="mail"></div>
      <div class="role">Approvals and chain checks</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <button class="out" onclick="signOut()">Sign out</button>
  </aside>
  <main class="main" id="view"></main>
</div>

<script>
let PAGE = 'home', DATA = null, BATCHES = [], BATCH = null, ROLL_LIST = null, EDITING = null;

const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  ask:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6L9 17l-5-5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>'
};

const KEY = 'eee_token';
const token = () => sessionStorage.getItem(KEY) || localStorage.getItem(KEY);   // this tab's own sign-in wins

async function api(path, opts = {}){
  opts.headers = Object.assign({}, opts.headers, {Authorization: 'Bearer ' + token()});
  const r = await fetch(path, opts);
  if (r.status === 401){ toLanding(); throw new Error('signed out'); }
  return r.json();
}
function toLanding(){
  localStorage.removeItem(KEY); sessionStorage.removeItem(KEY);
  location.href = 'landing.html#enter';
}
async function signOut(){ try { await api('/api/signout', {method:'POST'}); } catch (e) {} toLanding(); }

const view = html => { document.getElementById('view').innerHTML = html; window.scrollTo(0,0); };
const esc = t => { const d = document.createElement('div'); d.textContent = t ?? ''; return d.innerHTML; };
const ordinal = n => n + (['th','st','nd','rd'][n % 10 > 3 || Math.floor(n % 100 / 10) === 1 ? 0 : n % 10] || 'th');
const when = at => at ? at.slice(0,16).replace('T',' ') : '';

async function boot(){
  if (!token()) return toLanding();
  const me = await api('/api/me');
  if (me.role !== 'office'){
    location.href = {examiner:'exam.html', teacher:'teacher.html'}[me.role] || 'app.html';
    return;
  }
  document.getElementById('mail').textContent = me.email;
  await load();
  document.getElementById('app').classList.remove('hide');
  go('home');
}
async function load(){
  DATA = await api('/api/office/requests');
  BATCHES = (await api('/api/office/batches')).batches;
}
boot();

function drawNav(){
  document.getElementById('nav').innerHTML = `
    <button class="${PAGE==='home'?'on':''}" onclick="go('home')">${ICON.home} Home</button>
    <button class="${PAGE==='requests'?'on':''}" onclick="go('requests')">${ICON.ask} Class requests
      ${DATA.waiting ? `<small>${DATA.waiting} waiting</small>` : ''}</button>
    <button class="${PAGE==='chain'?'on':''}" onclick="go('chain')">${ICON.check} Chain check</button>
    <button class="${PAGE==='complaints'?'on':''}" onclick="go('complaints')">${ICON.flag} Complaints</button>
    <button class="${PAGE==='teachers'?'on':''}" onclick="go('teachers')">${ICON.check} Teachers</button>
    <div class="group">BATCHES</div>
    ${BATCHES.map(b => `<button class="code ${PAGE==='batch' && BATCH===b.name ? 'on' : ''}"
        onclick="openBatch('${b.name}')">${b.name}<small>${b.students}</small></button>`).join('')}
    <button class="${PAGE==='newbatch'?'on':''}" onclick="go('newbatch')">${ICON.plus} Add a new batch</button>`;
}

function go(page){
  PAGE = page;
  drawNav();
  if (page === 'home') return homePage();
  if (page === 'requests') return requestsPage();
  if (page === 'chain') return chainPage();
  if (page === 'complaints') return complaintsPage();
  if (page === 'teachers') return teachersPage();
  if (page === 'newbatch') return newBatchPage();
}

/* ============================================================
   home
   ============================================================ */
function homePage(){
  const students = BATCHES.reduce((n, b) => n + b.students, 0);
  view(`
    <h1 class="page in">Office desk</h1>
    <p class="lede in d1">The office holds the register: who is in which batch, and which teacher is
      allowed to enter marks. Every change here is written to the chain.</p>
    <div class="box in d2">
      <h2>Right now</h2>
      <div class="tiles">
        <div class="tile"><div class="k">Batches</div><div class="v">${BATCHES.length}</div></div>
        <div class="tile"><div class="k">Students on the register</div><div class="v">${students}</div></div>
        <div class="tile ${DATA.waiting ? 'warn' : ''}"><div class="k">Class requests waiting</div>
          <div class="v">${DATA.waiting}</div></div>
      </div>
    </div>
    <div class="box in d3">
      <h2>Batches</h2>
      <p class="lede">Open a batch to add a student, change their details, or take someone off the register.</p>
      <div class="tiles" style="margin-top:14px">
        ${BATCHES.map(b => `<button class="tile pick" onclick="openBatch('${b.name}')">
            <div class="k">${b.name}</div><div class="v">${b.students}</div>
            <div class="k">students · semester ${b.semester}</div></button>`).join('')
          || '<p class="lede">No batches yet.</p>'}
      </div>
      <div style="margin-top:16px"><button class="btn" onclick="go('newbatch')">Add a new batch</button></div>
    </div>`);
}

/* ============================================================
   a new batch
   ============================================================ */
function newBatchPage(){
  view(`
    <h1 class="page in">Add a new batch</h1>
    <p class="lede in d1">A batch is one year's intake, like 2026–27. Students are added to it afterwards.</p>
    <div class="box in d2">
      <h2>The new batch</h2>
      <div class="form">
        <div><label for="bName">Name</label>
          <input id="bName" placeholder="2026–27"></div>
        <div><label for="bSem">Which semester is it in now?</label>
          <select id="bSem">${[1,2,3,4,5,6,7,8].map(n => `<option value="${n}">${ordinal(n)} semester</option>`).join('')}</select></div>
        <div class="row">
          <button class="btn solid" onclick="saveBatch()">Add the batch</button>
          <span class="msg" id="bMsg"></span>
        </div>
      </div>
    </div>`);
}

async function saveBatch(){
  const msg = document.getElementById('bMsg');
  msg.className = 'msg';
  const res = await api('/api/office/batch', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name: document.getElementById('bName').value,
                          semester: document.getElementById('bSem').value})});
  if (!res.ok){ msg.className = 'msg bad'; msg.textContent = res.why; return; }
  await load();
  openBatch(document.getElementById('bName').value.trim());
}

/* ============================================================
   one batch — the student register
   ============================================================ */
async function openBatch(name){
  PAGE = 'batch'; BATCH = name; EDITING = null;
  drawNav();
  view(`<h1 class="page in">${esc(name)}</h1><p class="lede in d1">Loading the register…</p>`);
  ROLL_LIST = await api(`/api/office/students?session=${encodeURIComponent(name)}`);
  drawBatch();
}

function drawBatch(){
  const b = ROLL_LIST.batch, list = ROLL_LIST.students;
  const rows = list.map(s => EDITING === s.roll ? editRow(s) : showRow(s)).join('');
  view(`
    <h1 class="page in">${esc(b.name)}</h1>
    <p class="lede in d1">${b.students} student${b.students === 1 ? '' : 's'} ·
      currently in ${ordinal(b.semester)} semester · a student's email is their roll number @std.cu.ac.bd</p>

    <div class="box in d2">
      <h2>Add a student</h2>
      <div class="form two">
        <div><label for="nRoll">Roll number</label><input id="nRoll" inputmode="numeric" placeholder="24702056"></div>
        <div><label for="nName">Full name</label><input id="nName" placeholder="Name as on the certificate"></div>
        <div><label for="nId">Student ID</label><input id="nId" placeholder="optional"></div>
        <div><label for="nFa">Father's name</label><input id="nFa"></div>
        <div><label for="nFaBn">Father's name in Bangla</label><input id="nFaBn"></div>
        <div><label for="nMo">Mother's name</label><input id="nMo"></div>
        <div><label for="nMoBn">Mother's name in Bangla</label><input id="nMoBn"></div>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn solid" onclick="addStudent()">Add to ${esc(b.name)}</button>
        <span class="msg" id="addMsg"></span>
      </div>
      <p class="foot2" style="margin-top:12px">The parents' names are what a student must match to register,
        so they are worth getting right. They stay in the office's records and never go on the chain.</p>
    </div>

    <div class="box in d3">
      <h2>On the register <span class="r">${list.length}</span></h2>
      <div class="sheet">
        <table><thead><tr><th>Roll</th><th>Name</th><th>Student ID</th><th>Father</th><th>Mother</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" style="padding:18px">Nobody yet.</td></tr>'}</tbody></table>
      </div>
      <div class="msg" id="rowMsg"></div>
    </div>`);
}

function showRow(s){
  return `<tr>
    <td class="mono">${s.roll}${s.registered ? '' : '<div class="tiny">not registered yet</div>'}</td>
    <td>${esc(s.name)}</td>
    <td class="mono">${s.student_id ? esc(s.student_id) : '—'}</td>
    <td>${esc(s.father_en || s.father_bn || '—')}</td>
    <td>${esc(s.mother_en || s.mother_bn || '—')}</td>
    <td class="right"><button class="btn small" onclick="EDITING='${s.roll}';drawBatch()">Change</button>
      <button class="btn small" onclick="askRemove('${s.roll}')">Remove</button></td>
  </tr>`;
}

function editRow(s){
  const box = (k, v) => `<input id="e-${k}" value="${esc(v || '')}">`;
  return `<tr class="editing">
    <td class="mono">${s.roll}</td>
    <td>${box('name', s.name)}</td>
    <td>${box('student_id', s.student_id)}</td>
    <td>${box('father_en', s.father_en)}${box('father_bn', s.father_bn)}</td>
    <td>${box('mother_en', s.mother_en)}${box('mother_bn', s.mother_bn)}</td>
    <td class="right"><button class="btn solid small" onclick="saveStudent('${s.roll}')">Save</button>
      <button class="btn small" onclick="EDITING=null;drawBatch()">Cancel</button></td>
  </tr>`;
}

async function addStudent(){
  const msg = document.getElementById('addMsg');
  msg.className = 'msg';
  const get = id => document.getElementById(id).value;
  const res = await api('/api/office/student', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({doing:'add', session: BATCH, roll: get('nRoll'), name: get('nName'),
      student_id: get('nId'), father_en: get('nFa'), father_bn: get('nFaBn'),
      mother_en: get('nMo'), mother_bn: get('nMoBn')})});
  if (!res.ok){ msg.className = 'msg bad'; msg.textContent = res.why; return; }
  await load();
  openBatch(BATCH);
}

async function saveStudent(roll){
  const get = k => document.getElementById('e-' + k).value;
  const fields = {};
  ['name','student_id','father_en','father_bn','mother_en','mother_bn']
    .forEach(k => fields[k] = get(k));
  const res = await api('/api/office/student', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({doing:'change', roll, fields})});
  if (!res.ok){ document.getElementById('rowMsg').textContent = res.why; return; }
  EDITING = null;
  openBatch(BATCH);
}

function askRemove(roll){
  const s = ROLL_LIST.students.find(x => x.roll === roll);
  const why = prompt(`Remove ${s.name} (${roll}) from the register?\n\n`
    + 'Anything already on the chain stays there. Why are they being removed?');
  if (why === null) return;
  doRemove(roll, why);
}

async function doRemove(roll, reason){
  const res = await api('/api/office/student', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({doing:'remove', roll, reason})});
  if (!res.ok){ document.getElementById('rowMsg').textContent = res.why; return; }
  await load();
  openBatch(BATCH);
}

/* ============================================================
   class requests — the office's first job
   ============================================================ */
function askCard(r){
  const state = r.status === 'approved' ? `<span class="pill ok">approved</span>`
              : r.status === 'waiting'  ? `<span class="pill wait">waiting</span>`
              :                           `<span class="pill no">turned down</span>`;
  const decided = r.status === 'waiting' ? '' :
    `<div class="m">${r.status === 'approved' ? 'Approved' : 'Turned down'} by ${esc(r.decided_by || '')} · ${when(r.decided_at)}${r.note ? `<br>“${esc(r.note)}”` : ''}</div>`;
  const buttons = r.status !== 'waiting' ? '' : `
    <div class="row">
      <input id="note-${r.id}" placeholder="A reason, needed only when you turn it down">
      <button class="btn solid small" onclick="decide(${r.id}, true)">Approve</button>
      <button class="btn small" onclick="decide(${r.id}, false)">Turn down</button>
      <div class="msg" id="msg-${r.id}"></div>
    </div>`;
  return `<div class="ask ${r.status === 'waiting' ? 'waiting' : ''}">
      <div class="top"><span class="code">${r.code}</span><h3>${esc(r.title)}</h3>${state}</div>
      <div class="m">${esc(r.teacher)} · session ${r.session} · ${ordinal(r.semester)} semester ·
        ${r.students} student${r.students === 1 ? '' : 's'} on that class list<br>
        Asked ${when(r.asked_at)} · request #${r.id}</div>
      ${decided}${buttons}
    </div>`;
}

function requestsPage(){
  const waiting = DATA.requests.filter(r => r.status === 'waiting');
  const done = DATA.requests.filter(r => r.status !== 'waiting');
  view(`
    <h1 class="page in">Class requests</h1>
    <p class="lede in d1">A teacher can only open a class after you approve it. Your answer is written to the chain, so who allowed which teacher to enter marks is part of the permanent record.</p>
    <div class="box in d2">
      <h2>Waiting <span class="r">${waiting.length || 'none'}</span></h2>
      ${waiting.map(askCard).join('') || '<p class="lede">Nothing is waiting for you right now.</p>'}
    </div>
    <div class="box in d3">
      <h2>Already answered <span class="r">${done.length}</span></h2>
      ${done.map(askCard).join('') || '<p class="lede">Nothing answered yet.</p>'}
    </div>`);
}

async function decide(id, approve){
  const note = (document.getElementById('note-' + id) || {}).value || '';
  const res = await api('/api/office/decide', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({request_id: id, approve, note})});
  if (!res.ok){ document.getElementById('msg-' + id).textContent = res.why; return; }
  await load();
  go('requests');
}

/* ============================================================
   chain check — the office's second job
   ============================================================ */
async function chainPage(){
  drawChain();
  demoSetup();
  const p = await api('/api/peers');
  const rows = p.copies.map(c => `<tr>
      <td><b>${esc(c.name)}</b><div class="tiny">${esc(c.url)}</div></td>
      <td class="mono">${c.count === null ? '—' : c.count}</td>
      <td class="mono">${c.head ? esc(c.head.slice(0,16)) + '…' : '—'}</td>
      <td>${!c.live ? '<span class="pill dim">not answering</span>'
            : c.head === p.writer.head ? '<span class="pill ok">same as ours</span>'
            : '<span class="pill no">different</span>'}</td>
      <td class="tiny">${c.seconds_ago}s ago</td></tr>`).join('');
  const box = document.getElementById('copies');
  if (box) box.innerHTML = `
    <h2>Copies on other laptops <span class="r">${p.copies.length}</span></h2>
    <p class="lede">Each of these holds its own full copy and checks every record itself.
      They are not asked to trust this laptop.</p>
    <div class="sheet">
      <table><thead><tr><th>Laptop</th><th>Records</th><th>Last fingerprint</th><th></th><th>Heard from</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" style="padding:16px">No copies are running.</td></tr>'}</tbody></table>
    </div>
    <p class="foot2">This laptop holds <b class="mono">${p.writer.count}</b> records ·
      head <span class="mono">${p.writer.head ? esc(p.writer.head.slice(0,16)) + '…' : '—'}</span></p>`;
}

function drawChain(){
  view(`
    <h1 class="page in">Chain check</h1>
    <p class="lede in d1">Every record carries a fingerprint of the one before it. If anyone edits the database directly, the fingerprints stop matching and the check below names the first block that doesn't fit.</p>
    <div class="box in d2">
      <h2>Check the whole chain now</h2>
      <p class="lede">This reads every block from the first one and recomputes its fingerprint.</p>
      <div style="margin-top:14px"><button class="btn solid" id="checkBtn" onclick="runCheck()">Run the check</button></div>
      <div id="checkOut"></div>
    </div>
    <div class="box in d2 hide" id="demoBox">
      <h2>Demo: an insider edit</h2>
      <p class="lede">For showing the system to visitors. This changes the newest mark straight in the
        database, the way someone with database access could, with no correction and no reason.
        Then press <b>Run the check</b> above. <span id="demoMail"></span></p>
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" onclick="demoTamper()">Simulate an insider edit</button>
        <button class="btn" onclick="demoUndo()">Put it back</button>
      </div>
      <div id="demoOut"></div>
    </div>
    <div class="box in d3" id="copies"><h2>Copies on other laptops</h2>
      <p class="lede">Asking…</p></div>`);
}

async function runCheck(){
  const btn = document.getElementById('checkBtn'), out = document.getElementById('checkOut');
  btn.disabled = true;
  out.innerHTML = '<p class="lede">Reading every block…</p>';
  const res = await api('/api/verify');
  out.innerHTML = `<div class="result ${res.ok ? 'good' : 'bad'}">
      <b>${res.ok ? 'The chain is intact.' : 'The chain has been tampered with.'}</b>${esc(res.message)}
      ${!res.ok && res.alerts && res.email ? '<div class="tiny" style="margin-top:6px">Alert emails are on their way to the student and the office.</div>' : ''}</div>`;
  btn.disabled = false;
}

/* ============================================================
   complaints — facilities only, without the sender's name
   ============================================================ */
async function complaintsPage(){
  const d = await api('/api/office/complaints');
  const cards = d.complaints.map(c => `
    <div class="box">
      <h2>#${c.id} · ${esc(c.what)} <span class="r">${when(c.at)}</span></h2>
      <p class="lede"><b>Why it is a problem:</b> ${esc(c.why)}</p>
      <p class="lede"><b>What should be fixed:</b> ${esc(c.fix)}</p>
      ${c.photo ? `<img class="cphoto" data-id="${c.id}" alt="Photo sent with complaint ${c.id}">` : ''}
      <div style="margin-top:12px">${c.flagged
        ? `<span class="pill no">Flagged as unnecessary</span> <span class="tiny">by ${esc(c.flagged_by)} · ${when(c.flagged_at)}</span>`
        : `<button class="btn" onclick="flagComplaint(${c.id})">Flag as unnecessary</button>`}</div>
    </div>`).join('');
  view(`
    <h1 class="page in">Complaints</h1>
    <p class="lede in d1">Facilities complaints from students. The sender's name is never shown here.
      Flag a complaint only if it is not about department facilities; the account that sent it is then warned.</p>
    ${cards || '<div class="box in d2"><p class="lede">No complaints yet.</p></div>'}`);
  document.querySelectorAll('img.cphoto').forEach(async img => {
    const r = await fetch('/api/office/complaint-photo?id=' + img.dataset.id,
                          {headers: {Authorization: 'Bearer ' + token()}});
    if (r.ok) img.src = URL.createObjectURL(await r.blob()); else img.remove();
  });
}

async function flagComplaint(id){
  if (!confirm('Flag complaint #' + id + ' as unnecessary? The account that sent it will see a warning.')) return;
  const res = await api('/api/office/complaint-flag', {method: 'POST', body: JSON.stringify({id})});
  if (!res.ok) alert(res.why);
  complaintsPage();
}

/* ============================================================
   teachers — accounts for faculty members
   ============================================================ */
async function teachersPage(note = ''){
  const d = await api('/api/office/faculty');
  const rowsHtml = d.faculty.map(f => `<tr>
      <td><b>${esc(f.name)}</b>${f.chairman ? ' <span class="pill ok">Chairman</span>' : ''}<div class="tiny">${esc(f.designation)}</div></td>
      <td class="mono tiny">${esc(f.email)}</td>
      <td>${f.has_account ? '<span class="pill ok">Has an account</span>'
          : f.can_have ? `<button class="btn" onclick="addTeacher('${esc(f.email)}')">Create account</button>`
          : '<span class="tiny">Needs a @cu.ac.bd email</span>'}</td></tr>`).join('');
  view(`
    <h1 class="page in">Teachers</h1>
    <p class="lede in d1">Teachers cannot register themselves. The office creates their account here, and the
      teacher signs in with their university email and the password shown once below.</p>
    ${note}
    <div class="box in d2"><div class="sheet"><table>
      <thead><tr><th>Name</th><th>Email</th><th></th></tr></thead><tbody>${rowsHtml}</tbody></table></div></div>`);
}

async function addTeacher(email){
  const res = await api('/api/office/add-teacher', {method: 'POST', body: JSON.stringify({email})});
  teachersPage(res.ok
    ? `<div class="result good in d1"><b>Account created.</b>${esc(res.email)} · password <span class="mono">${esc(res.password)}</span>
        — give this to the teacher now; it is not shown again.</div>`
    : `<div class="result bad in d1">${esc(res.why)}</div>`);
}

async function demoSetup(){
  const d = await api('/api/office/demo');
  const box = document.getElementById('demoBox');
  if (!box || !d.enabled) return;
  box.classList.remove('hide');
  document.getElementById('demoMail').textContent = d.email
    ? `Alerts are emailed to the student${d.office_email ? ' and to ' + d.office_email : ''}.`
    : 'Email is not set up on this server, so no alert emails are sent.';
}

async function demoTamper(){
  const out = document.getElementById('demoOut');
  const res = await api('/api/office/demo-tamper', {method: 'POST', body: '{}'});
  out.innerHTML = res.ok
    ? `<div class="result bad"><b>Changed.</b>Block ${res.block_no}: ${esc(res.roll)}'s ${esc(res.item_id)} went from ${res.was} to ${res.now}, with no reason. Now run the check.</div>`
    : `<div class="result bad">${esc(res.why || 'Could not do that.')}</div>`;
}

async function demoUndo(){
  const out = document.getElementById('demoOut');
  const res = await api('/api/office/demo-undo', {method: 'POST', body: '{}'});
  out.innerHTML = res.ok
    ? `<div class="result good"><b>Put back.</b>Block ${res.block_no} is exactly as it was. Run the check again.</div>`
    : `<div class="result bad">${esc(res.why || 'Could not do that.')}</div>`;
}
</script>
</body>
</html>
