<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final exam marks — EEE Records</title>
<style>
:root{
  --side:#1E2A32; --side-text:#AEBBC4; --cream:#F6F2EE; --card:#fff;
  --ink:#1C1A19; --grey:#6E6764; --line:#E4DCD6;
  --accent:#7E2233; --accent-wash:#F4E8EA;
  --ok:#3F6A52; --ok-wash:#E3EFE7; --bad:#A4343F; --bad-wash:#F8E3E5;
  --edit:#B07A12; --edit-wash:#FBF3E2;
  --butter:#F2EBC6; --mist:#D3E4E8; --clay:#E7DFDB; --sage:#DCE6D8;
  --sans:Arial,Helvetica,sans-serif; --serif:Arial,Helvetica,sans-serif; --mono:Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--sans)}
button,input{font-family:inherit}

.in{opacity:0;transform:translateY(18px);animation:up .5s cubic-bezier(.16,.84,.34,1) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1;transform:none}}

.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-text);padding:26px 0 22px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.me{padding:0 24px 22px;border-bottom:1px solid #2E3C46;margin-bottom:18px}
.me .dot{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600}
.me .nm{color:#fff;font-weight:600;font-size:13px;margin-top:12px;overflow-wrap:anywhere}
.me .sub{font-size:12.5px;margin-top:4px;color:#D6C8A8}
.cap{font-size:11px;letter-spacing:.1em;color:#6F8290;padding:8px 18px 6px 34px}

/* the curved active tab */
.nav{display:flex;flex-direction:column;gap:6px;padding-left:16px}
.nav button{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border:none;background:none;color:var(--side-text);font-size:14.5px;text-align:left;cursor:pointer;border-radius:22px 0 0 22px}
.nav button:hover{color:#fff}
.nav button small{font-size:11.5px;opacity:.7}
.nav button.on{background:var(--cream);color:var(--ink);font-weight:600}
.nav button.on::before,.nav button.on::after{content:"";position:absolute;right:0;width:22px;height:22px;background:transparent;pointer-events:none}
.nav button.on::before{top:-22px;border-bottom-right-radius:22px;box-shadow:8px 8px 0 8px var(--cream)}
.nav button.on::after{bottom:-22px;border-top-right-radius:22px;box-shadow:8px -8px 0 8px var(--cream)}
.side .out{margin:auto 24px 0;background:none;border:1px solid #3A4A55;color:var(--side-text);border-radius:30px;padding:9px;font-size:13px;cursor:pointer}

.main{padding:34px 40px 70px}
h1{font-family:var(--serif);font-weight:600;font-size:36px;font-weight:400;line-height:1.1}
.lede{color:var(--grey);margin-top:6px;font-size:14.5px;line-height:1.55}

/* semester cards */
.sems{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:26px}
.sem{border:1px solid var(--line);border-radius:18px;padding:18px;height:150px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;background:var(--card);transition:transform .2s ease,border-color .2s ease}
.sem:hover{transform:translateY(-3px);border-color:var(--accent)}
.sem:nth-child(4n+1){background:var(--butter)}.sem:nth-child(4n+2){background:var(--mist)}
.sem:nth-child(4n+3){background:var(--clay)}.sem:nth-child(4n+4){background:var(--sage)}
.sem.later{opacity:.5;cursor:default}
.sem.later:hover{transform:none;border-color:var(--line)}
.sem .n{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1}
.sem .s{font-size:12.5px;color:var(--grey)}
.sem .tag{align-self:flex-start;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.75)}

/* the grid */
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:22px 0 14px}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--grey)}
.key b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:30px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer}
.btn.solid{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.count{font-size:13.5px;color:var(--grey);margin-left:auto}

.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:auto;max-height:70vh}
table{border-collapse:separate;border-spacing:0;min-width:100%}
th,td{padding:0;border-bottom:1px solid #EFE9E4;white-space:nowrap}
thead th{position:sticky;top:0;z-index:2;background:var(--card);font-size:12px;font-weight:600;color:var(--grey);text-align:center;padding:14px 16px;border-bottom:1px solid var(--line)}
thead th span{display:block;font-weight:400;font-size:11px;margin-top:2px}
th.who,td.who{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;padding:10px 20px;border-right:1px solid var(--line)}
thead th.who{z-index:3}
td.who .r{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13.5px}
td.who .nm{font-size:12.5px;color:var(--grey);margin-top:2px}
td.cell{padding:10px 14px;text-align:center}
tbody tr:focus-within td{background:#FBF7F2}
tbody tr:focus-within td.who{background:#F6EEE4;box-shadow:inset 3px 0 0 var(--accent)}
.cell input{width:78px;padding:10px 8px;border:1px solid var(--line);border-radius:10px;text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;background:var(--cream)}
.cell input:focus{outline:2px solid var(--accent);background:#fff}
.cell input.edited{border-color:var(--edit);background:var(--edit-wash)}
.cell input.absent{color:var(--bad);font-weight:600}
.cell input.bad{border-color:var(--bad);background:var(--bad-wash);color:var(--bad)}
.cell .why{font-size:11px;color:var(--bad);margin-top:4px;min-height:13px}

/* review */
.review{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-top:20px}
.review h2{font-family:var(--serif);font-weight:600;font-size:26px;font-weight:400}
.review table{margin-top:14px;min-width:0;width:100%}
.review td,.review th{padding:10px 12px;text-align:left;font-size:14px;border-bottom:1px solid #EFE9E4}
.review th{font-size:12px;color:var(--grey);font-weight:600}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px}
.pill.new{background:var(--ok-wash);color:var(--ok)}
.pill.chg{background:var(--edit-wash);color:var(--edit)}
.pill.no{background:var(--bad-wash);color:var(--bad)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row2{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.done{margin-top:14px;font-size:14px}

.empty{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;margin-top:22px}
.hide{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto}
  .nav{flex-direction:row;flex-wrap:wrap;padding:0 14px}
  .nav button{border-radius:22px}
  .nav button.on::before,.nav button.on::after{display:none}
  .main{padding:22px 14px 60px}
}
</style>
<style>
/* every page opens with a 0.5 s fade from the cream background */
html{background:#F6F2EE}
body{animation:pageIn .5s ease backwards}
@keyframes pageIn{from{opacity:0}}
@media (prefers-reduced-motion:reduce){body{animation:none}}
</style>
</head>
<body>
<div class="shell hide" id="app">
  <aside class="side">
    <div class="me">
      <div class="dot">EX</div>
      <div class="nm" id="who"></div>
      <div class="sub">Examiner · final exams only</div>
    </div>
    <div class="cap">SESSIONS</div>
    <nav class="nav" id="nav"></nav>
    <button class="out" onclick="signOut()">Sign out</button>
  </aside>
  <main class="main" id="view"></main>
</div>

<script>
const KEY = 'eee_token';
const token = () => sessionStorage.getItem(KEY) || localStorage.getItem(KEY);   // this tab's own sign-in wins
let SESSIONS = [], SESSION = null, GRID = null;

async function api(path, opts = {}){
  opts.headers = Object.assign({}, opts.headers, {Authorization: 'Bearer ' + token()});
  const r = await fetch(path, opts);
  if (r.status === 401){ toLanding(); throw new Error('signed out'); }
  return r.json();
}
function toLanding(){ localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); location.href = 'landing.html#enter'; }
async function signOut(){ try { await api('/api/signout', {method:'POST'}); } catch (e) {} toLanding(); }
const view = html => { document.getElementById('view').innerHTML = html; window.scrollTo(0,0); };
const esc = t => { const d = document.createElement('div'); d.textContent = t ?? ''; return d.innerHTML; };
const ordinal = n => n + (['th','st','nd','rd'][n % 10 > 3 || Math.floor(n % 100 / 10) === 1 ? 0 : n % 10] || 'th');

async function boot(){
  if (!token()) return toLanding();
  const me = await api('/api/me');
  if (me.role !== 'examiner'){
    location.href = {teacher:'teacher.html', office:'office.html'}[me.role] || 'app.html';
    return;
  }
  document.getElementById('who').textContent = me.email;
  SESSIONS = (await api('/api/exam/sessions')).sessions;
  document.getElementById('app').classList.remove('hide');
  openSession(SESSIONS.find(s => s.students) ? SESSIONS.find(s => s.students).name : SESSIONS[0].name);
}

function drawNav(){
  document.getElementById('nav').innerHTML = SESSIONS.map(s =>
    `<button class="${s.name === SESSION ? 'on' : ''}" onclick="openSession('${s.name}')">${s.name}<small>sem ${s.current}</small></button>`).join('');
}

/* ---------------- a session: its eight semesters ---------------- */
function openSession(name){
  SESSION = name; drawNav();
  const s = SESSIONS.find(x => x.name === name);
  const cards = Array.from({length: 8}, (_, i) => {
    const n = i + 1;
    const state = n < s.current ? 'past' : n === s.current ? 'now' : 'later';
    const tag = state === 'now' ? '<span class="tag">current</span>' : state === 'past' ? '<span class="tag">finished</span>' : '<span></span>';
    return `<button class="sem ${state === 'later' ? 'later' : ''} in d${Math.min(i % 4, 3)}" ${state === 'later' ? 'tabindex="-1"' : `onclick="openGrid(${n})"`}>
        ${tag}<div><div class="n">${ordinal(n)}</div><div class="s">Semester</div></div>
        <div class="s">${state === 'later' ? 'not yet' : state === 'now' ? 'final exams' : 'view marks'}</div></button>`;
  }).join('');
  view(`<h1 class="in">Session ${name}</h1>
    <p class="lede in d1">${s.students} student${s.students === 1 ? '' : 's'} in this session. Pick a semester to enter its final exam marks.</p>
    <div class="sems">${cards}</div>`);
}

/* ---------------- the grid ---------------- */
async function openGrid(sem){
  GRID = await api(`/api/exam/grid?session=${encodeURIComponent(SESSION)}&semester=${sem}`);
  GRID.sem = sem;
  if (!GRID.loaded){
    view(`<h1 class="in">${ordinal(sem)} semester · ${SESSION}</h1>
      <div class="empty in d1"><b>No course data in the prototype for this semester.</b>
      <p class="lede">Only Semester 5 has its courses loaded right now.${GRID.students.length ? '' : ' This session also has no demo students.'}</p>
      <div class="row2"><button class="btn" onclick="openSession(SESSION)">Back</button></div></div>`);
    return;
  }

  const head = GRID.courses.map(c => `<th>${c.code}<span>${esc(c.title)}</span></th>`).join('');
  const body = GRID.students.map((st, r) => `<tr>
      <td class="who"><div class="r">${st.roll}</div><div class="nm">${esc(st.name)}</div></td>
      ${GRID.courses.map((c, col) => {
        const m = GRID.marks[`${st.roll}|${c.course_id}`];
        const shown = m ? (m.absent ? 'A' : m.value) : '';
        return `<td class="cell"><input data-r="${r}" data-c="${col}" data-roll="${st.roll}" data-course="${c.course_id}"
                 data-was="${shown}" value="${shown}" class="${m && m.absent ? 'absent' : ''}" inputmode="decimal"
                 aria-label="${st.roll} ${c.code}" oninput="check(this)" onkeydown="move(event, this)"><div class="why"></div></td>`;
      }).join('')}</tr>`).join('');

  view(`<h1 class="in">${ordinal(sem)} semester · ${SESSION}</h1>
    <p class="lede in d1">Final exam marks, out of ${GRID.out_of}. Nothing saves until you review it.</p>
    <div class="bar in d2">
      <div class="key"><span><b>0–${GRID.out_of}</b> the mark</span><span><b>A</b> absent</span><span><b>blank</b> not entered yet</span><span><b>Enter</b> next student</span></div>
      <span class="count" id="count">No changes</span>
      <button class="btn solid" id="reviewBtn" onclick="review()" disabled>Review changes</button>
      <button class="btn" onclick="publishAsk()">Publish results</button>
    </div>
    <div class="sheet in d3"><table><thead><tr><th class="who">Student</th>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <div id="reviewBox"></div>`);
}

/* ---------------- publishing ---------------- */
function publishAsk(){
  if (document.querySelectorAll('.cell input.edited').length){
    alert('Save or undo your changes before publishing.'); return;
  }
  document.getElementById('reviewBox').innerHTML = `<div class="review in">
    <h2>Publish ${ordinal(GRID.sem)} semester results?</h2>
    <p class="lede">Every student whose finals are all in gets their course grades and semester GPA, permanently, on the chain.
      Their marks become visible to them, and a GPA of 2.00 or more moves them to the next semester.
      Anyone still missing a final is held back from publishing and named below — you can publish them later.</p>
    <div class="row2"><button class="btn solid" onclick="publish()">Publish</button>
      <button class="btn" onclick="document.getElementById('reviewBox').innerHTML=''">Cancel</button></div>
    <div class="done" id="done"></div></div>`;
  document.getElementById('reviewBox').scrollIntoView({behavior:'smooth'});
}

async function publish(){
  const res = await api('/api/exam/publish', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session: SESSION, semester: GRID.sem})});
  const box = document.getElementById('done');
  if (!res.ok){ box.innerHTML = `<span class="pill no">${res.why}</span>`; return; }
  const name = r => (GRID.students.find(s => s.roll === r) || {}).name || '';
  const pub = res.published.map(p => `<tr><td class="mono">${p.roll}</td><td>${esc(name(p.roll))}</td>
      <td class="mono">${p.gpa.toFixed(2)}</td><td>${p.gpa >= 2 ? '<span class="pill new">promoted</span>' : '<span class="pill no">not promoted</span>'}</td></tr>`).join('');
  const held = res.withheld.map(w => `<tr><td class="mono">${w.roll}</td><td>${esc(name(w.roll))}</td>
      <td colspan="2">missing: ${w.missing.join(', ')}</td></tr>`).join('');
  box.innerHTML = `
    <p><b>${res.published.length}</b> published · <b>${res.withheld.length}</b> held back · <b>${res.already.length}</b> already published before</p>
    ${pub ? `<table><tr><th>Roll</th><th>Name</th><th>GPA</th><th></th></tr>${pub}</table>` : ''}
    ${held ? `<details style="margin-top:14px"><summary>Held back — finals missing (${res.withheld.length})</summary>
      <table><tr><th>Roll</th><th>Name</th><th colspan="2"></th></tr>${held}</table></details>` : ''}`;
}

/* read one cell: a number, A for absent, or blank */
function parse(v){
  v = v.trim();
  if (v === '') return {blank: true};
  if (/^a$/i.test(v)) return {absent: true};
  const n = Number(v);
  if (!Number.isFinite(n) || !/^\d+(\.\d{1,2})?$/.test(v)) return {bad: 'Not a mark'};
  if (n > GRID.out_of) return {bad: `Above ${GRID.out_of}`};
  return {value: n};
}

function check(el){
  const p = parse(el.value), why = el.nextElementSibling;
  el.classList.remove('bad', 'edited', 'absent');
  why.textContent = '';
  if (p.bad){ el.classList.add('bad'); why.textContent = p.bad; }
  else if (p.blank && el.dataset.was !== ''){ el.classList.add('bad'); why.textContent = "Can't erase — change it"; }
  else {
    if (p.absent) el.classList.add('absent');
    if (el.value.trim().toUpperCase() !== String(el.dataset.was).toUpperCase()) el.classList.add('edited');
  }
  tally();
}

function tally(){
  const edited = document.querySelectorAll('.cell input.edited').length;
  const bad = document.querySelectorAll('.cell input.bad').length;
  document.getElementById('count').textContent = bad ? `${bad} to fix` : edited ? `${edited} change${edited > 1 ? 's' : ''}` : 'No changes';
  document.getElementById('reviewBtn').disabled = !edited || bad > 0;
}

/* Enter moves down the same course, the way examiners mark */
function move(e, el){
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const next = document.querySelector(`.cell input[data-r="${+el.dataset.r + (e.shiftKey ? -1 : 1)}"][data-c="${el.dataset.c}"]`);
  if (next){ next.focus(); next.select(); }
}

/* ---------------- review, then save ---------------- */
function review(){
  const code = id => GRID.courses.find(c => c.course_id === id).code;
  const name = r => GRID.students.find(s => s.roll === r).name;
  const rows = [...document.querySelectorAll('.cell input.edited')].map(el => {
    const p = parse(el.value);
    const now = p.absent ? 'Absent' : p.value;
    const was = el.dataset.was === '' ? '' : (el.dataset.was.toUpperCase() === 'A' ? 'Absent' : el.dataset.was);
    return `<tr><td class="mono">${el.dataset.roll}</td><td>${esc(name(el.dataset.roll))}</td><td>${code(el.dataset.course)}</td>
      <td class="mono">${was ? `${was} → ` : ''}<b>${now}</b></td>
      <td>${was ? '<span class="pill chg">change</span>' : '<span class="pill new">new</span>'}</td></tr>`;
  }).join('');
  document.getElementById('reviewBox').innerHTML = `<div class="review in">
      <h2>Check before saving</h2>
      <p class="lede">Each line becomes a permanent entry on the chain, signed with your email. A change keeps the old mark visible.</p>
      <table><tr><th>Roll</th><th>Name</th><th>Course</th><th>Mark</th><th></th></tr>${rows}</table>
      <div class="row2"><button class="btn solid" onclick="save()">Save to the chain</button>
        <button class="btn" onclick="document.getElementById('reviewBox').innerHTML=''">Keep editing</button></div>
      <div class="done" id="done"></div></div>`;
  document.getElementById('reviewBox').scrollIntoView({behavior:'smooth'});
}

async function save(){
  const entries = [...document.querySelectorAll('.cell input.edited')].map(el => {
    const p = parse(el.value);
    return {roll: el.dataset.roll, course_id: el.dataset.course, value: p.absent ? null : p.value, absent: !!p.absent};
  });
  const res = await api('/api/exam/save', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({entries})});
  const failed = res.results.filter(r => !r.ok);
  if (failed.length){
    document.getElementById('done').innerHTML = failed.map(f => `<div class="pill no">${f.roll} · ${f.why}</div>`).join(' ');
    return;
  }
  await openGrid(GRID.sem);
  document.getElementById('count').textContent = `Saved ${entries.length} mark${entries.length > 1 ? 's' : ''} to the chain`;
}

boot();
</script>
</body>
</html>
